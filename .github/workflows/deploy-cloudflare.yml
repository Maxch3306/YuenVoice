name: Deploy to Cloudflare

# Builds the SPA, applies D1 migrations, and deploys the Worker (API + static
# assets) to Cloudflare.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN   — token with Workers Scripts:Edit, D1:Edit, Workers KV:Edit,
#                            Workers R2 Storage:Edit on the target account
#   CLOUDFLARE_ACCOUNT_ID  — the Cloudflare account id
#
# Worker runtime secrets (JWT_ACCESS_SECRET, JWT_REFRESH_SECRET, VAPID_PRIVATE_KEY)
# and the admin password (CONFIG KV 'admin:password') are set once out-of-band via
# `wrangler secret put` / `wrangler kv key put`, NOT by this workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/server/**'
      - 'packages/client/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-cloudflare.yml'

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build the client SPA into packages/client/dist (served as Worker assets).
      - run: pnpm --filter client build

      # Regenerate binding types from wrangler.jsonc, then typecheck the Worker.
      - run: pnpm --filter server cf:types
      - run: pnpm --filter server cf:typecheck

      # Apply any pending D1 migrations to the remote database.
      - run: pnpm --filter server d1:migrate:remote

      # Deploy the Worker (uploads the SPA assets + API).
      - run: pnpm --filter server cf:deploy
